<title>Mepa AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: creator workspace — brand bar, six-step tab rail (look back → plan → create → learn → ask), one working surface below. */
:root {
  --bg: #fbf8f1;
  --surface: #fffdf8;
  --surface-2: #f3eee3;
  --line: #e7e0d2;
  --ink: #1b2422;
  --ink-2: #4b5450;
  --ink-3: #7a827e;
  --brand: #1f8f7a;
  --tab: #f1ece1;
  --tab-active: #1f3b37;
  --tab-active-ink: #f6f1e5;
  --t1: #1f3b37; --t1-ink: #f6f1e5;
  --t2: #f6dcc0; --t2-ink: #3b2a1c;
  --t3: #f2ede1; --t3-ink: #1b2422;
  --t4: #d7eadf; --t4-ink: #1b2422;
  --side: #cfe4d8;
  --cta: #c2412a; --cta-ink: #ffffff;
  --chip: #ffffff;
  --good: #1d7a4a; --good-bg: #d8efe0;
  --bad: #b8372b; --bad-bg: #f8dcd6;
  --grid: #ece6da;
  --s-ig: #eb6834; --s-tt: #1baf7a; --s-yt: #2a78d6;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b2726; --surface: #213130; --surface-2: #273a38; --line: #33473f;
    --ink: #eef1ea; --ink-2: #b9c3be; --ink-3: #8b9792; --brand: #3cc2a6;
    --tab: #26363a; --tab-active: #f1ebdc; --tab-active-ink: #1b2726;
    --t1: #d6e6c3; --t1-ink: #1b2726; --t2: #4a392b; --t2-ink: #f5e5d2; --t3: #26332f; --t3-ink: #eef1ea; --t4: #2c4a3f; --t4-ink: #eef1ea;
    --side: #2e4a3f; --cta: #ef8a66; --cta-ink: #1b2726; --chip: #2a3b39;
    --good: #6fd39c; --good-bg: #24473a; --bad: #f08c80; --bad-bg: #4d2c28; --grid: #2d3e3b;
    --s-ig: #d95926; --s-tt: #199e70; --s-yt: #3987e5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b2726; --surface: #213130; --surface-2: #273a38; --line: #33473f;
  --ink: #eef1ea; --ink-2: #b9c3be; --ink-3: #8b9792; --brand: #3cc2a6;
  --tab: #26363a; --tab-active: #f1ebdc; --tab-active-ink: #1b2726;
  --t1: #d6e6c3; --t1-ink: #1b2726; --t2: #4a392b; --t2-ink: #f5e5d2; --t3: #26332f; --t3-ink: #eef1ea; --t4: #2c4a3f; --t4-ink: #eef1ea;
  --side: #2e4a3f; --cta: #ef8a66; --cta-ink: #1b2726; --chip: #2a3b39;
  --good: #6fd39c; --good-bg: #24473a; --bad: #f08c80; --bad-bg: #4d2c28; --grid: #2d3e3b;
  --s-ig: #d95926; --s-tt: #199e70; --s-yt: #3987e5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 800; }
h2 { font-size: 1.1rem; font-weight: 800; }
h3 { font-size: 0.98rem; font-weight: 700; }
p { margin: 0; }
svg { flex-shrink: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 0.82rem; }
.eyebrow { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.wrap { max-width: 1240px; margin-inline: auto; padding-inline: clamp(16px, 3vw, 32px); }
.topbar { padding-block: 18px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.03em; text-decoration: none; color: var(--ink); }
.logo sup { font-size: 0.6rem; font-weight: 700; margin-left: 1px; }
.top-r { display: flex; align-items: center; gap: 10px; position: relative; }
.ws { font-size: 0.85rem; color: var(--ink-2); font-weight: 500; }
.iconbtn { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.iconbtn:hover { background: var(--surface-2); }
.dotcount { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--cta); color: var(--cta-ink); font-size: 0.68rem; font-weight: 800; display: grid; place-items: center; padding-inline: 4px; border: 2px solid var(--bg); }
.me { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); font-weight: 800; font-size: 0.78rem; cursor: pointer; }

.tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding-bottom: 6px; }
.tab { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--tab); color: var(--ink); text-decoration: none; min-width: 0; }
.tab:hover { filter: brightness(0.98); }
.tab[aria-current="page"] { background: var(--tab-active); color: var(--tab-active-ink); }
.tab .tt { font-weight: 700; font-size: 0.86rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .ts { font-size: 0.72rem; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab > span { min-width: 0; display: grid; }

main { padding-block: 22px 56px; }
.crumb { font-size: 0.78rem; color: var(--ink-3); display: flex; gap: 6px; }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.pagehead p { color: var(--ink-2); margin-top: 4px; }
.period { background: var(--surface-2); border-radius: 10px; padding: 6px 12px; font-size: 0.8rem; font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: grid; gap: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 9px 15px; font-weight: 700; font-size: 0.86rem; border: 1px solid transparent; cursor: pointer; background: none; white-space: nowrap; text-decoration: none; color: inherit; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-cta { background: var(--cta); color: var(--cta-ink); }
.btn-dark { background: var(--tab-active); color: var(--tab-active-ink); }
.btn-ghost { border-color: var(--line); background: var(--chip); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn-sm { padding: 6px 11px; font-size: 0.78rem; border-radius: 9px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 11px; font-size: 0.78rem; font-weight: 600; cursor: pointer; color: var(--ink); text-decoration: none; }
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--tab-active); color: var(--tab-active-ink); border-color: var(--tab-active); }
.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; padding: 3px 9px; font-size: 0.75rem; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.good { background: var(--good-bg); color: var(--good); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.warn { background: var(--t2); color: var(--t2-ink); }
.sw { width: 9px; height: 9px; display: inline-block; flex-shrink: 0; }
.sw.instagram { background: var(--s-ig); border-radius: 50%; }
.sw.tiktok { background: var(--s-tt); border-radius: 2px; }
.sw.youtube { background: var(--s-yt); transform: rotate(45deg); border-radius: 1px; width: 8px; height: 8px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.95fr); gap: 18px; }
.idrow { display: flex; gap: 14px; align-items: flex-start; }
.av { width: 52px; height: 52px; border-radius: 50%; background: var(--tab-active); color: var(--tab-active-ink); display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
.handle { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
.plats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.plat { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 4px 9px; font-size: 0.76rem; font-weight: 600; background: var(--surface-2); }
.plat b { font-weight: 800; }
.illu { position: relative; border-radius: 14px; overflow: hidden; background: #f6efe0; border: 1px solid var(--line); min-height: 170px; }
.illu svg { width: 100%; height: 100%; display: block; }
.illu .cap { position: absolute; left: 10px; bottom: 8px; font-size: 0.68rem; font-weight: 700; color: #4b5450; }
.viewas { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 0.8rem; color: var(--ink-3); }
.viewas select { border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 4px 8px; font-size: 0.8rem; }

.side { background: var(--side); border: 0; display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 8px; position: relative; }
.side h2 { font-size: 1.7rem; margin-top: 6px; }
.side p { color: var(--ink-2); margin-top: 6px; font-size: 0.9rem; }
.mascot { position: relative; width: 150px; height: 150px; cursor: pointer; border: 0; background: none; padding: 0; }
.mascot svg { width: 100%; height: 100%; }
.mascot .pill { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; border: 1px solid var(--line); }
.mascot:hover svg { transform: rotate(-3deg) scale(1.03); }
.mascot svg { transition: transform 0.2s; }
.grounded { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--ink-2); border-top: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); padding-top: 10px; margin-top: 6px; }

/* KPI tiles */
.kpi { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; text-decoration: none; position: relative; min-width: 0; }
.kpi .l { font-size: 0.78rem; font-weight: 600; opacity: 0.85; }
.kpi .v { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-top: 4px; }
.kpi .go { position: absolute; top: 12px; right: 12px; opacity: 0.7; }
.kpi .d { margin-top: 6px; justify-self: start; display: inline-flex; gap: 4px; align-items: center; font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 2px 7px; }
.k1 { background: var(--t1); color: var(--t1-ink); } .k2 { background: var(--t2); color: var(--t2-ink); } .k3 { background: var(--t3); color: var(--t3-ink); border: 1px solid var(--line); } .k4 { background: var(--t4); color: var(--t4-ink); }
.d.up { background: color-mix(in oklab, var(--good) 22%, transparent); }
.d.down { background: color-mix(in oklab, var(--bad) 20%, transparent); }
.d.flat { background: color-mix(in oklab, currentColor 12%, transparent); }

.moves-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
.move { border-radius: var(--r); padding: 16px; display: grid; gap: 8px; align-content: start; text-decoration: none; color: inherit; min-height: 210px; grid-template-rows: auto auto 1fr auto; }
.move h3 { font-size: 1.12rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; }
.move p { font-size: 0.84rem; opacity: 0.85; }
.move .foot { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 700; }
.m1 { background: var(--t4); color: var(--t4-ink); } .m2 { background: var(--t2); color: var(--t2-ink); } .m3 { background: var(--t3); color: var(--t3-ink); border: 1px solid var(--line); }
.move:hover { filter: brightness(0.98); }

/* Donut */
.donut-wrap { display: grid; justify-items: center; gap: 4px; margin-block: 8px 14px; }
.donut { width: 190px; height: 190px; }
.donut path { cursor: pointer; transition: opacity 0.15s; }
.legend-list { display: grid; gap: 8px; }
.lrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--chip); cursor: pointer; font-size: 0.86rem; font-weight: 600; text-align: left; width: 100%; }
.lrow[aria-pressed="true"] { border-color: var(--ink); }
.lrow b { font-weight: 800; }

/* Charts */
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; touch-action: none; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 0.78rem; box-shadow: 0 6px 18px rgb(0 0 0 / 0.1); white-space: nowrap; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; gap: 4px; }
.bar-top { display: flex; justify-content: space-between; font-size: 0.86rem; gap: 8px; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--brand); border-radius: 999px; transition: opacity 0.15s; }
.bars:hover .bar-fill { opacity: 0.4; }
.bars .bar-row:hover .bar-fill { opacity: 1; }
.bar-detail { font-size: 0.75rem; color: var(--ink-3); height: 0; overflow: hidden; transition: height 0.15s; }
.bar-row:hover .bar-detail, .bar-row:focus-within .bar-detail { height: 1.2em; }
.heat-scroll { overflow-x: auto; }
.heat { display: grid; grid-template-columns: 34px repeat(24, minmax(14px, 1fr)); gap: 2px; min-width: 460px; }
.heat .hl { font-size: 0.66rem; color: var(--ink-3); text-align: center; }
.heat .dl { font-size: 0.7rem; color: var(--ink-3); text-align: right; padding-right: 4px; line-height: 18px; }
.heat .cell { height: 18px; border-radius: 3px; }
.heat .cell.best { outline: 2px solid var(--ink); outline-offset: -2px; }
.legend { display: flex; align-items: center; gap: 3px; font-size: 0.74rem; color: var(--ink-3); }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
th { text-align: left; font-size: 0.73rem; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.table-scroll { overflow-x: auto; }
.cap1 { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Chat */
.chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: calc(100vh - 260px); min-height: 460px; }
.msgs { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 2px 16px; }
.msg-user { align-self: flex-end; max-width: 78%; background: var(--tab-active); color: var(--tab-active-ink); padding: 10px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
.msg-ai { align-self: flex-start; max-width: 88%; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; }
.msg-ai .bubble { background: var(--surface); border: 1px solid var(--line); padding: 12px 16px; border-radius: 16px 16px 16px 4px; min-width: 0; }
.mini { width: 36px; height: 36px; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.md p { margin: 0.35em 0; }
.md ul, .md ol { margin: 0.35em 0; padding-left: 1.25em; }
.md li { margin: 0.15em 0; }
.md h4 { margin: 0.6em 0 0.2em; font-size: 0.98rem; }
.md code { font-size: 0.85em; background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
.composer { display: flex; gap: 8px; align-items: flex-end; padding-top: 10px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; min-height: 46px; max-height: 160px; }
.starters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 660px; }
.starter { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; color: var(--ink-2); font-size: 0.88rem; }
.starter:hover { background: var(--surface-2); }
.thinking { display: inline-flex; gap: 4px; align-items: center; color: var(--ink-3); font-size: 0.85rem; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: pulse 1s infinite ease-in-out; }
.dot:nth-child(2) { animation-delay: 0.15s; } .dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

/* Plan */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 150px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.day.today { border-color: var(--ink); }
.day-h { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--ink-3); font-weight: 700; }
.idea { border-radius: 10px; background: var(--surface-2); padding: 9px 10px; cursor: pointer; border: 1px solid transparent; text-align: left; display: grid; gap: 4px; width: 100%; }
.idea:hover { border-color: var(--line); }
.idea .t { font-weight: 700; font-size: 0.82rem; line-height: 1.3; }
.idea .m { font-size: 0.7rem; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.idea.posted { opacity: 0.55; } .idea.posted .t { text-decoration: line-through; }

/* Studio */
.field { display: grid; gap: 5px; }
.field label { font-size: 0.78rem; font-weight: 700; color: var(--ink-2); }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; padding: 9px 11px; width: 100%; }
.field textarea { min-height: 70px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.range { display: grid; gap: 6px; }
.range-bar { position: relative; height: 14px; background: var(--surface-2); border-radius: 999px; }
.range-bar i { position: absolute; top: 0; bottom: 0; background: var(--brand); border-radius: 999px; opacity: 0.85; }
.range-bar b { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--ink); border-radius: 2px; }
.factor { display: flex; justify-content: space-between; font-size: 0.84rem; padding: 6px 0; border-bottom: 1px solid var(--line); }
.factor:last-child { border-bottom: 0; }

/* Deals */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.col-h { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--ink-2); padding: 2px 4px; }
.deal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; display: grid; gap: 6px; width: 100%; }
.deal:hover { border-color: var(--ink-3); }
.deal .b { font-weight: 800; }

/* Layers */
.scrim { position: fixed; inset: 0; background: rgb(10 20 18 / 0.45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 18px; width: min(540px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 22px; display: grid; gap: 14px; border: 1px solid var(--line); }
.drawer-scrim { place-items: stretch end; padding: 0; }
.drawer { background: var(--surface); width: min(520px, 100%); height: 100%; overflow-y: auto; padding: 22px; display: grid; gap: 14px; align-content: start; border-left: 1px solid var(--line); }

const BANNED = { gambling: ["casino", "gambling", "betting", "poker"], alcohol: ["alcohol", "beer", "vodka", "gin"], crypto: ["crypto", "token", "nft"], "fast fashion": ["fast fashion"] };
function fit(d) {
  const b = S.profile.boundaries.toLowerCase(), w = (d.brand + " " + d.what + " " + d.note).toLowerCase();
  for (const [rule, words] of Object.entries(BANNED)) if (b.includes(rule) && words.some((x) => w.includes(x))) return { level: "bad", label: "Breaks your boundaries" };
  const s = summarize(within(S.data[d.platform]?.posts || [], 90)), r = rate(d.platform, s.avgViews, s.avgEr);
  return d.offer < r.low ? { level: "warn", label: "Below your rate" } : { level: "good", label: "Good fit" };
}
function vDeals() {
  const sum = (st) => S.deals.filter((d) => d.stage === st).reduce((a, d) => a + d.offer, 0);
  return `${head("Brand deals", "Every offer in one place. Mepa checks the fit, the price and the fine print.", `<button class="btn btn-ghost" data-act="adddeal">Add an offer</button>`)}
  <div class="grid4">${[["New offers", S.deals.filter((d) => d.stage === "new").length, "k2"], ["In negotiation", eur(sum("negotiating")), "k3"], ["Confirmed", eur(sum("confirmed")), "k4"], ["Paid this month", eur(sum("paid")), "k1"]].map(([l, v, c]) => `<div class="kpi ${c}"><span class="l">${l}</span><span class="v num" style="font-size:1.6rem">${v}</span></div>`).join("")}</div>
  <div class="board" style="margin-top:16px">${STAGES.map(([kk, l]) => `<div class="col"><div class="col-h"><span>${l}</span><span>${S.deals.filter((d) => d.stage === kk).length}</span></div>${S.deals.filter((d) => d.stage === kk).map((d) => { const f = fit(d); return `<button class="deal" data-act="deal" data-id="${d.id}"><span class="row between"><span class="b">${esc(d.brand)}</span><span class="num" style="font-weight:700">${eur(d.offer)}</span></span><span class="small muted">${esc(d.what)}</span><span class="row"><span class="tag ${f.level}">${f.label}</span>${kk === "new" ? `<span class="tag">Reply by ${dl(d.due, { day: "numeric", month: "short" })}</span>` : ""}</span></button>`; }).join("")}</div>`).join("")}</div>`;
}
let dealCtl = null;
function dealDrawer(id) {
  const d = S.deals.find((x) => x.id === id); if (!d) return;
  const f = fit(d), s = summarize(within(S.data[d.platform].posts, 90)), r = rate(d.platform, s.avgViews, s.avgEr);
  drawer(`<div class="row between"><span class="tag ${f.level}">${f.label}</span><button class="btn btn-ghost btn-sm" data-act="close">Close</button></div>
  <h2 style="font-size:1.45rem">${esc(d.brand)}</h2><p>${esc(d.what)}</p>
  <div class="table-scroll"><table><tbody><tr><td class="muted">Offer</td><td class="num" style="font-weight:700">${eur(d.offer)}</td></tr><tr><td class="muted">Your typical rate</td><td class="num">${eur(r.low)}–${eur(r.high)} per ${PL[d.platform]} post</td></tr><tr><td class="muted">Usage rights</td><td>${esc(d.usage)}</td></tr><tr><td class="muted">Exclusivity</td><td>${esc(d.exclusivity)}</td></tr><tr><td class="muted">Reply by</td><td>${dl(d.due, { weekday: "long", day: "numeric", month: "long" })}</td></tr><tr><td class="muted">Contact</td><td style="user-select:all">${esc(d.contact)}</td></tr><tr><td class="muted">Notes</td><td>${esc(d.note)}</td></tr></tbody></table></div>
  <div class="field"><label for="stage">Stage</label><select id="stage">${STAGES.map(([kk, l]) => `<option value="${kk}" ${kk === d.stage ? "selected" : ""}>${l}</option>`).join("")}</select></div>
  <div class="card" style="background:var(--side);border:0;display:grid;gap:10px"><div class="row between"><div class="row"><div class="mascot" style="width:40px;height:40px">${mascotSVG("dm")}</div><h3>Mepa's take</h3></div><button class="btn btn-cta btn-sm" data-act="evaldeal" data-id="${d.id}" id="evalBtn">Evaluate & draft reply</button></div><div class="md" id="dealOut"><p class="muted">Get a verdict, a counter-offer and a ready-to-send reply.</p></div><p class="ai-off" id="dealNote"></p></div>`);
  $("#stage").addEventListener("change", (e) => { d.stage = e.target.value; persist(); render(); toast(`Moved ${d.brand} to ${STAGES.find(([kk]) => kk === d.stage)[1]}`); });
}
async function evalDeal(id) {
  if (dealCtl) { dealCtl.abort(); return; }
  const d = S.deals.find((x) => x.id === id), out = $("#dealOut"), btn = $("#evalBtn"), note = $("#dealNote"), f = fit(d), s = summarize(within(S.data[d.platform].posts, 90)), r = rate(d.platform, s.avgViews, s.avgEr);
  out.innerHTML = `<span class="thinking"><i class="dot"></i><i class="dot"></i><i class="dot"></i> Reading the offer…</span>`; note.textContent = ""; btn.textContent = "Stop"; dealCtl = new AbortController();
  const sample = aiState === "off" ? null : await getSample();
  try {
    if (!sample) throw { offline: true };
    const res = await sample(`You are Mepa, an AI talent manager. Evaluate this brand offer for your creator and draft their reply. Use markdown sections: "Verdict" (accept, counter or decline, and why, one line), "Watch out for" (2-4 bullets on usage rights, exclusivity, timing, payment terms; suggest a lawyer for anything binding), "Counter-offer" (EUR amount with rationale; skip if declining), "Draft reply" (short, friendly email in the creator's voice, first person). Remind them to label the post as an ad if they accept. Never recommend deals that break the creator's boundaries.
Creator: ${S.profile.name}, ${S.profile.niche}. Boundaries: ${S.profile.boundaries}. Voice: ${S.profile.voice}.
${PL[d.platform]} stats, 90 days: ${s.avgViews} avg views, ${pct(s.avgEr)} engagement, ${followers(d.platform).toLocaleString("en")} followers. Benchmark: ${eur(r.low)}–${eur(r.high)} per post.
Offer: ${d.brand}: ${d.what}. ${eur(d.offer)}. Usage: ${d.usage}. Exclusivity: ${d.exclusivity}. Reply by ${dl(d.due)}. Notes: ${d.note}`, { signal: dealCtl.signal, cache: false, onText: ({ text }) => { out.innerHTML = md(text); } });
    out.innerHTML = md(res.text); aiState = "on";
  } catch (e) {
    if (e?.code === "cancelled") { if (e.text) out.innerHTML = md(e.text); }
    else if (e?.offline || permanentOff(e)) { aiState = "off"; out.innerHTML = md(offlineDeal(d, f, r)); note.textContent = OFF_NOTE; }
    else { if (e?.text) out.innerHTML = md(e.text); note.textContent = errCopy(e); }
  } finally { dealCtl = null; const b = $("#evalBtn"); if (b) b.textContent = "Evaluate & draft reply"; }
}
function offlineDeal(d, f, r) {
  if (f.level === "bad") return `#### Verdict\nDecline. ${d.brand} breaks your boundary (${S.profile.boundaries.toLowerCase()}). The money isn't worth your audience's trust.\n\n#### Draft reply\nHi ${d.brand} team,\n\nThanks for reaching out! I only partner with brands that fit my community, so I'll pass on this one.\n\nBest,\n${S.profile.name}`;
  const multi = /\+|and|2 /.test(d.what) ? 1.7 : 1, counter = Math.max(d.offer, Math.round(((r.low + r.high) / 2) * multi / 50) * 50);
  return `#### Verdict\n${d.offer >= r.low * multi ? "Accept, after checking the terms." : `Counter. ${eur(d.offer)} is under your benchmark for this package.`}\n\n#### Watch out for\n- Usage: **${d.usage}**. ${/paid|ads|whitelist/i.test(d.usage) ? "Paid usage is worth +30-50% on top of the post fee." : "Organic only is standard."}\n- Exclusivity: **${d.exclusivity}**. ${/none/i.test(d.exclusivity) ? "No restrictions, good." : "Check it doesn't block other deals you're discussing."}\n- Ask for 50% upfront and payment within 30 days. Have anything binding checked by a lawyer.\n- Label the posts as **Werbung / Ad**.\n\n#### Counter-offer\n**${eur(counter)}**, based on your ${k(summarize(within(S.data[d.platform].posts, 90)).avgViews)} average views.\n\n#### Draft reply\nHi ${d.brand} team,\n\nThanks so much, I'd love to work together. For ${d.what.toLowerCase()}, my rate is ${eur(counter)}, including ${d.usage.toLowerCase()} usage. Happy to send a few concepts this week.\n\nBest,\n${S.profile.name}`;
}

    pushNotif({ type: "deal", icon: "deal", title: "New offer from Wavecraft Audio", body: "€2,200 for a TikTok sample-pack challenge. Mepa thinks it's a good fit.", go: "deal:d6" });
    if (current === "deals") render();
  }, 14000);
}

/* ================================================================ layers */
function modal(html) { $("#layer").innerHTML = `<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; $("#layer").querySelector("input, .btn-dark")?.focus(); }
function drawer(html) { $("#layer").innerHTML = `<div class="scrim drawer-scrim" data-act="scrim"><div class="drawer" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeLayer() { dealCtl?.abort(); $("#layer").innerHTML = ""; }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied"); } catch { toast("Select the text to copy it"); } }

/* ================================================================ events */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!e.target.closest("#popover") && !e.target.closest("#bell") && !e.target.closest("#meBtn")) closePop();
  if (!t) return;
  const a = t.dataset.act;
  if (a === "scrim") { if (e.target === t) closeLayer(); return; }
  if (a === "close") return closeLayer();
  if (a === "bell") { if ($("#popover .pop:not(.menu)")) return closePop(); return notifPanel(); }
  if (a === "menu") { if ($("#popover .menu")) return closePop(); return workspaceMenu(); }
  if (a === "notif") return openNotif(t.dataset.id);
  if (a === "readall") { S.notifs.forEach((n) => (n.read = true)); persist(); renderShell(); return notifPanel(); }
  if (a === "testnotif") return pushNotif({ type: "remind", icon: "clock", title: "Test: post in 30 minutes", body: "This is how posting reminders look.", go: "growth" });
  if (a === "theme") { const root = document.documentElement, dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); root.dataset.theme = dark ? "light" : "dark"; closePop(); return render(); }
  if (a === "mascot") { location.hash = "chat"; return; }
  if (a === "focus") { S.focus = S.focus === t.dataset.p ? null : t.dataset.p; return renderDonut(); }
  if (a === "perfpf") { S.perfPf = t.dataset.v; return render(); }
  if (a === "perfdays") { S.perfDays = +t.dataset.v; return render(); }
  if (a === "ask") { if (current !== "chat") { pendingAsk = t.dataset.q; location.hash = "chat"; } else ask(t.dataset.q); return; }
  if (a === "newchat") { chatCtl?.abort(); S.chat = []; return renderMsgs(); }
  if (a === "reset") { try { localStorage.removeItem(KEY); } catch {} location.hash = "overview"; location.reload(); return; }
  if (a === "genplan") return genPlan();
  if (a === "idea") return ideaDrawer(t.dataset.id);
  if (a === "ideastatus") { const x = S.plan.find((i) => i.id === t.dataset.id); if (x) { x.status = t.dataset.v; persist(); closeLayer(); render(); toast(x.status === "posted" ? "Marked as posted" : x.status === "dismissed" ? "Removed from plan" : "Updated"); } return; }
  if (a === "copycap") { const x = S.plan.find((i) => i.id === t.dataset.id); return copy(`${x.caption}\n\n${x.hashtags.map((h) => "#" + h.replace(/^#/, "")).join(" ")}`); }
  if (a === "st") { const st = studioState(); st[t.dataset.k] = t.dataset.v; if (t.dataset.k === "platform") { st.format = ""; st.slot = ""; } return render(); }
  if (a === "stwrite") return studioWrite();
  if (a === "stsave") return studioSave();
  if (a === "deal") { if (current !== "deals") { location.hash = "deals"; return setTimeout(() => dealDrawer(t.dataset.id), 80); } return dealDrawer(t.dataset.id); }
  if (a === "evaldeal") return evalDeal(t.dataset.id);
  if (a === "adddeal") return addDealModal();
  if (a === "genreport") return genReport();
  if (a === "copylink") return copy("https://" + $("#klink").value);
  if (a === "connect") return connectModal(t.dataset.p);
  if (a === "allow") return runConnect(t.dataset.p);
  if (a === "disc") { const p = t.dataset.p; $("#acct-" + p).innerHTML = `<div class="row"><span class="small">Disconnect and delete synced data?</span><button class="btn btn-ghost btn-sm" data-act="disc-yes" data-p="${p}">Disconnect</button><button class="btn btn-ghost btn-sm" data-act="disc-no">Keep</button></div>`; return; }
  if (a === "disc-yes") { const p = t.dataset.p; if (platforms().length === 1) { toast("Keep at least one account connected in the demo"); return render(); } S.connected[p] = false; if (S.focus === p) S.focus = null; if (S.perfPf === p) S.perfPf = "all"; if (S.studio?.platform === p) S.studio = null; persist(); render(); return toast(`${PL[p]} disconnected`); }
  if (a === "disc-no") return render();
});
document.addEventListener("mouseover", (e) => { const c = e.target.closest(".cell"), tip = $("#heatTip"); if (c && tip) tip.textContent = c.dataset.tip; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePop(); if ($("#layer").innerHTML) closeLayer(); } });
window.addEventListener("hashchange", route);
route();
scheduleLive();
</script>
